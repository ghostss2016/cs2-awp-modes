# CS2 AWP Modes Configuration
# Native MetaMod AWP mode built on the arena queue/ladder engine

[General]
# Minimum players to start arenas
MinPlayers = 2

# Allow bots in arenas
AllowBots = true

# VIP only mode
VIPOnly = false

# VIP permission flag
VIPFlag = @css/vip

# Debug mode
Debug = false

[AWPMode]
# awp_arena = AWP-only ladder; awp_rotation also exposes optional Scout/Deagle/Knife rounds
Mode = awp_arena
AllowScout = false
AllowDeagle = false
AllowKnife = true
Armor = true
Helmet = true
RoundTime = 60

[Database]
# Database host
Host = localhost

# Database username
Username = root

# Database password
Password = password

# Database name
Database = database

# Database port
Port = 3306

# Table prefix
TablePrefix =

# Days to keep player data (0 = never purge)
TablePurgeDays = 30

# SSL mode (Preferred, Required, None)
Sslmode = Preferred

[DefaultWeapons]
# Default rifle
DefaultRifle = weapon_ak47

# Default sniper
DefaultSniper = weapon_awp

# Default shotgun
DefaultShotgun = weapon_nova

# Default SMG
DefaultSMG = weapon_mp9

# Default LMG
DefaultLMG = weapon_m249

# Default pistol
DefaultPistol = weapon_glock

# Default round type (translation key)
DefaultRound = k4.rounds.awp

[Compatibility]
# Disable clan tags
DisableClantags = false

# Prevent draw rounds (random winner)
PreventDrawRounds = false

# Allow suicide
AllowSuicide = false

# Disable damage messages
DisableDamageMessage = false

# Disable opponent messages
DisableOpponentMessage = false

# Disable round type messages
DisableRoundTypeMessage = false

# Block damage of players outside the active duel
BlockDamageOfNotOpponent = true

# Block flash effects outside the active duel
BlockFlashOfNotOpponent = true
